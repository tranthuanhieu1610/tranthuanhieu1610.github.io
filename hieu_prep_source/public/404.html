<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... - HieuPrep</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f9fafb;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }
        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(to right, #3b82f6, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        .message {
            color: #6b7280;
            margin-bottom: 1.5rem;
        }
        .spinner {
            border: 3px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .link {
            color: #3b82f6;
            text-decoration: none;
        }
        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">HieuPrep</div>
        <div class="spinner"></div>
        <div class="message" id="message">Redirecting...</div>
        <p style="color: #9ca3af; font-size: 0.875rem;">
            If you are not redirected, <a href="/hieu_prep/" class="link">click here</a>
        </p>
    </div>

    <script>
        (function() {
            // Get the current path
            var path = window.location.pathname;
            var basePath = '/hieu_prep';

            // Remove base path if present
            if (path.startsWith(basePath)) {
                path = path.substring(basePath.length);
            }

            // Handle old practice URLs: /practice/[id] -> /practice/question?id=[id]
            var practiceMatch = path.match(/^\/practice\/([a-zA-Z0-9]+)\/?$/);
            if (practiceMatch) {
                var questionId = practiceMatch[1];
                var newUrl = basePath + '/practice/question?id=' + questionId;
                document.getElementById('message').textContent = 'Redirecting to question page...';
                window.location.href = newUrl;
                return;
            }

            // If it's any other 404, redirect to home after 3 seconds
            document.getElementById('message').textContent = 'Page not found. Redirecting to home...';
            setTimeout(function() {
                window.location.href = basePath + '/';
            }, 3000);
        })();
    </script>
</body>
</html>
